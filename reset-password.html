<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — SCOUT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">✦</span>SCOUT</a></header><main class="builder-wrap"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new <em>password.</em></h1><p class="builder-lede">Use at least 8 characters. Your existing sessions will be signed out.</p><form id="reset-form" class="builder-card"><div id="reset-note" class="login-note"></div><label>New password<input id="reset-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><label>Confirm password<input id="reset-confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button class="pill-btn dark" type="submit">Reset password ↗</button></form></main><script src="api.js"></script><script>const f=document.getElementById('reset-form'),n=document.getElementById('reset-note'),token=new URLSearchParams(location.search).get('token');f.addEventListener('submit',async e=>{e.preventDefault();n.classList.remove('show');const p=document.getElementById('reset-password').value,c=document.getElementById('reset-confirm').value;if(p!==c){n.textContent='Passwords do not match.';n.classList.add('show');return}try{await SCOUT_API.resetPassword(token,p);n.textContent='Password reset successfully. You can now log in.';n.classList.add('show');f.querySelector('button').disabled=true}catch(err){n.textContent=err.message;n.classList.add('show')}});</script></body></html>
