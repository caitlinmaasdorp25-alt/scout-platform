<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email — SCOUT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">✦</span>SCOUT</a><nav><a href="discover.html">Discover</a><a href="projects.html">Projects</a></nav><div class="header-actions"><a class="text-btn" href="login.html">Log in</a></div></header><main class="builder-wrap"><div class="eyebrow">ACCOUNT VERIFICATION</div><h1>Confirm your <em>email.</em></h1><p id="verify-copy" class="builder-lede">We're checking your verification link.</p><div id="verify-card" class="builder-card"><div id="verify-note" class="login-note show">Verifying…</div><a class="pill-btn dark" href="login.html">Go to login ↗</a></div></main><script src="api.js"></script><script>const note=document.getElementById('verify-note'),copy=document.getElementById('verify-copy');const token=new URLSearchParams(location.search).get('token');(async()=>{if(!token){note.textContent='No verification token was provided.';return}try{await SCOUT_API.verifyEmail(token);note.textContent='Your email is verified. You can now log in.';copy.textContent='Your SCOUT account is ready to use.'}catch(e){note.textContent=e.message}})();</script></body></html>
