<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — SCOUT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">✦</span>SCOUT</a><nav><a href="discover.html">Discover</a><a href="projects.html">Projects</a><a href="messages.html">Messages</a></nav><div class="header-actions"><a class="text-btn" href="join.html">Create account</a></div></header><main class="builder-wrap"><div class="eyebrow">WELCOME BACK</div><h1>Log in to <em>SCOUT.</em></h1><p class="builder-lede">Pick up where you left off. Your SCOUT account is securely authenticated by the SCOUT API.</p><form id="login-form" class="builder-card"><div id="login-note" class="login-note"></div><label>Email<input id="login-email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="login-password" type="password" required autocomplete="current-password" placeholder="Your password"></label><p class="login-switch"><a href="forgot-password.html">Forgot your password?</a></p><div id="verify-tools" hidden><p class="login-switch">Not verified yet? <button id="resend-verification" class="text-btn" type="button">Resend verification email</button></p></div><button class="pill-btn dark" type="submit">Log in ↗</button><p class="login-switch">New to SCOUT? <a href="join.html">Create your account</a></p></form></main><script>const form=document.getElementById('login-form'),note=document.getElementById('login-note');form.addEventListener('submit',async e=>{e.preventDefault();note.textContent='';note.classList.remove('show');try{await SCOUT_API.login(document.getElementById('login-email').value.trim(),document.getElementById('login-password').value);location.href='dashboard.html'}catch(err){note.textContent=err.message;note.classList.add('show');if(err.message.includes('verify'))document.getElementById('verify-tools').hidden=false}});
document.getElementById('resend-verification').addEventListener('click',async()=>{const email=document.getElementById('login-email').value.trim();if(!email){note.textContent='Enter your email first.';note.classList.add('show');return}try{const r=await SCOUT_API.resendVerification(email);note.textContent=r.message;note.classList.add('show')}catch(err){note.textContent=err.message;note.classList.add('show')}});</script><script src="api.js"></script></body></html>
