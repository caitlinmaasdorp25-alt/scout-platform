<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit your Scout Profile — SCOUT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">✦</span>SCOUT</a><nav><a href="discover.html">Discover</a><a href="projects.html">Projects</a><a href="messages.html">Messages</a><a href="dashboard.html">You</a></nav></header><main class="builder-wrap"><div class="eyebrow">SCOUT / EDIT PROFILE</div><h1>Make it <em>yours.</em></h1><p class="builder-lede">Your profile is your storefront. Keep it clear, specific and useful to someone deciding whether to contact you.</p><form id="edit-form" class="builder-card"><label>Name<input name="name" required></label><label>Role<input name="role" required></label><label>Category<select name="category"><option>Design</option><option>Technology</option><option>Marketing</option><option>Photography</option><option>Business</option><option>Beauty</option><option>Writing</option><option>Other</option></select></label><label>Location<input name="location" required></label><label>Availability<select name="availability"><option>Available</option><option>Busy until Oct</option><option>Not available</option></select></label><label>About you<textarea name="bio" required></textarea></label><label>Services<input name="services" placeholder="Brand Identity, Graphic Design"></label><label>Profile photo<input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="builder-section-label">YOUR WORK</div><div id="work-fields" class="work-fields"></div><button type="button" id="add-work" class="save-btn">+ Add a project</button><div class="builder-actions"><a class="save-btn" href="dashboard.html">Cancel</a><button class="pill-btn dark" type="submit">Save profile ↗</button></div></form><div id="saved-toast" class="profile-toast">Profile saved</div></main><script>const form=document.getElementById('edit-form'),workFields=document.getElementById('work-fields');let u=JSON.parse(localStorage.getItem('scoutProfile')||'null');if(!u){location.href='join.html'}function addWork(title='',desc='',image=''){
const row=document.createElement('div');row.className='work-editor';row.innerHTML=`<input class="work-title" placeholder="Project title"><input class="work-desc" placeholder="What was it?"><input class="work-image" type="file" accept="image/png,image/jpeg,image/webp"><button type="button" aria-label="Remove project">×</button>`;row.querySelector('.work-title').value=title;row.querySelector('.work-desc').value=desc;row.dataset.image=image||'';if(image){const preview=document.createElement('img');preview.className='work-preview';preview.src=image;row.insertBefore(preview,row.querySelector('button'));}row.querySelector('button').onclick=()=>row.remove();workFields.appendChild(row)}Object.entries(u).forEach(([k,v])=>{const el=form.elements[k];if(!el)return;el.value=Array.isArray(v)?v.join(', '):v});(u.projects||[]).forEach(x=>addWork(typeof x==='string'?x:x.title||'',typeof x==='string'?'':x.description||'',typeof x==='string'?'':x.image||''));if(!(u.projects||[]).length)addWork();document.getElementById('add-work').onclick=()=>addWork();async function saveWorkImages(){
 const rows=[...document.querySelectorAll('.work-editor')];
 for(let i=0;i<rows.length;i++){const file=rows[i].querySelector('.work-image')?.files?.[0];if(!file)continue;const reader=new FileReader();await new Promise((resolve,reject)=>{reader.onload=async()=>{try{const r=await SCOUT_API.uploadPortfolioImage(i,reader.result);rows[i].dataset.image=r.project.image;resolve()}catch(e){reject(e)}};reader.onerror=reject;reader.readAsDataURL(file)});}
 const latest=await SCOUT_API.me();u=latest.user;localStorage.setItem('scoutProfile',JSON.stringify(u));
}
form.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.services=(d.services||'').split(',').map(x=>x.trim()).filter(Boolean);d.projects=[...document.querySelectorAll('.work-editor')].map(r=>({title:r.querySelector('.work-title').value.trim(),description:r.querySelector('.work-desc').value.trim(),image:r.dataset.image||''})).filter(x=>x.title);try{const r=await SCOUT_API.updateProfile(d);u=r.user;localStorage.setItem('scoutProfile',JSON.stringify(u));const file=document.getElementById('avatar-file').files[0];if(file){const reader=new FileReader();reader.onload=async()=>{try{const av=await SCOUT_API.uploadAvatar(reader.result);u.avatar=av.avatar;}catch(err){alert(err.message);return}await saveWorkImages();localStorage.setItem('scoutProfile',JSON.stringify(u));location.href='dashboard.html'};reader.readAsDataURL(file)}else {await saveWorkImages();location.href='dashboard.html'}}catch(err){alert(err.message)}});</script><script src="api.js"></script></body></html>
