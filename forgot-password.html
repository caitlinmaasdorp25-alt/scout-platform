<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password — SCOUT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">✦</span>SCOUT</a><nav><a href="discover.html">Discover</a><a href="projects.html">Projects</a></nav></header><main class="builder-wrap"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Forgot your <em>password?</em></h1><p class="builder-lede">Enter your email and we'll create a secure reset link.</p><form id="forgot-form" class="builder-card"><div id="forgot-note" class="login-note"></div><label>Email<input id="forgot-email" type="email" required autocomplete="email" placeholder="you@example.com"></label><button class="pill-btn dark" type="submit">Send reset link ↗</button><p class="login-switch"><a href="login.html">Back to login</a></p></form></main><script src="api.js"></script><script>const f=document.getElementById('forgot-form'),n=document.getElementById('forgot-note');f.addEventListener('submit',async e=>{e.preventDefault();n.classList.remove('show');try{const r=await SCOUT_API.forgotPassword(document.getElementById('forgot-email').value.trim());n.textContent=r.message;n.classList.add('show')}catch(err){n.textContent=err.message;n.classList.add('show')}});</script></body></html>
